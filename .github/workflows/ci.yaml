name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  codespaces:
    # Mirrors a Codespace: the devcontainer image, running install.sh as the
    # non-root vscode user.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install as the vscode user
        run: |
          cp -r "$GITHUB_WORKSPACE" /home/vscode/dotfiles
          chown -R vscode:vscode /home/vscode/dotfiles
          sudo -u vscode -H env CODESPACES=true sh -c 'cd ~/dotfiles && ./install.sh'
      - name: Verify
        run: sudo -u vscode -H env CODESPACES=true ~vscode/dotfiles/.github/verify.sh

  macos:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install
        run: ./install.sh
      - name: Verify
        run: .github/verify.sh

  macos-intel:
    runs-on: macos-15-intel
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install
        run: ./install.sh
      - name: Verify
        run: .github/verify.sh

  ubuntu-focal:
    # Ubuntu 20.04 has glibc 2.31, older than some prebuilt binaries expect.
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - name: Install prerequisites
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates curl git zsh > /dev/null
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install
        run: ./install.sh
      - name: Verify
        run: .github/verify.sh
